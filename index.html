<!doctype html>
<!-- identity-check:allow — Architecture adapted from santifer/cv-santiago.

    <!-- Structured Data (JSON-LD)
         Only assert what is TRUE and VERIFIABLE. Every `sameAs` must resolve;
         every credential must have a real verification URL. Fabricated or
         dead entries actively damage entity resolution in search and AI answers.
         Add `hasCredential`, `subjectOf` (press), and `worksFor` only when real. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://eriktaylor.dev/#website",
          "url": "https://eriktaylor.dev",
          "name": "Erik Taylor — Applied AI Engineer",
          "inLanguage": ["en"],
          "publisher": { "@id": "https://eriktaylor.dev/#person" }
        },
        {
          "@type": "ProfilePage",
          "@id": "https://eriktaylor.dev/#profilepage",
          "url": "https://eriktaylor.dev",
          "mainEntity": { "@id": "https://eriktaylor.dev/#person" }
        },
        {
          "@type": "Person",
          "@id": "https://eriktaylor.dev/#person",
          "name": "Erik Taylor",
          "alternateName": ["Erik F. Taylor"],
          "url": "https://eriktaylor.dev",
          "image": "https://eriktaylor.dev/foto-avatar.png",
          "email": "hi@eriktaylor.dev",
          "description": "TODO: 2-3 sentence third-person bio. This is what AI search engines quote when asked who you are — make it specific and factual.",
          "jobTitle": ["TODO: Primary role", "TODO: Secondary role"],
          "knowsAbout": [
            "TODO: skill or domain 1",
            "TODO: skill or domain 2",
            "TODO: skill or domain 3"
          ],
          "sameAs": [
            "https://github.com/erikftaylor"
          ],
          "address": { "@type": "PostalAddress", "addressLocality": "TODO: City", "addressCountry": "TODO: CC" }
        }
      ]
    }
    </script>
    <!-- Theme detection before first paint (eliminates dark→light FOUC) -->
    <script>
      (function(){var s=localStorage.getItem('theme');var d=s?s==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;var h=document.documentElement;h.classList.toggle('dark',d);h.classList.toggle('light',!d);var m=document.querySelector('meta[name="color-scheme"]');if(m)m.content=d?'dark':'light';var t=document.querySelector('meta[name="theme-color"]');if(t)t.content=d?'#0a0a0a':'#ffffff'})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
